name: Backend CI

on:
  pull_request:
    paths: ["backend/**"]
  push:
    branches: [main]
    paths: ["backend/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Format, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-root

      - name: Format check (black)
        run: poetry run black --check .

      - name: Lint (ruff)
        run: poetry run ruff check .

      # One run, not two. This used to be a bare `pytest .` here plus a second
      # full suite in backend-coverage.yml, which doubled the cost of every
      # backend PR to produce one result. `--cov` is essentially free here and
      # enforces the gate, so the coverage report is simply taken from this run.
      #
      # The threshold lives in ONE place: `fail_under` in
      # backend/pyproject.toml, which pytest-cov reads and enforces. This step
      # names no percentage, so the two cannot disagree.
      #
      # `--cov-report=json` is required for the upload below: `[tool.coverage.json]
      # output` only takes effect when the json report is actually requested.
      - name: Test with coverage
        run: poetry run pytest --cov --cov-report=term-missing --cov-report=json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.json
          retention-days: 14
