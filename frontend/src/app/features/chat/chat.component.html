<section class="chat-panel">
  <header class="chat-panel__header">
    <h2 class="h3 chat-panel__title">Чат с агентом</h2>
  </header>

  <div class="chat-body">
    <ul #chatMessages class="chat-messages" role="log" aria-label="История сообщений">
      @for (message of messages(); track message.id; let last = $last) {
        <li>
          <app-chat-message
            [message]="message"
            [failed]="lastMessageFailed() && last"
            (preview)="openAttachmentPreview($event)"
            (download)="downloadAttachment($event)"
            (reply)="onRetryRequest()"
          />
        </li>
      }

      @if (agentStatus()) {
        <li>
          <app-agent-status />
        </li>
      }
    </ul>

    <footer class="chat-input-panel">
      @if (questions().length > 0 && !answersSubmitted()) {
        <app-chat-question-form
          [questions]="questions()"
          [submitting]="answersSubmitting()"
          (answersSubmitted)="sendAnswers($event)"
        />
      } @else {
        <form class="chat-input-panel__form" (submit)="sendMessage($event)">
          <app-drag-n-drop
            [sessionId]="id()"
            variant="compact"
            (filesChange)="onFilesChange($event)"
            (uploadingChange)="onUploadingChange($event)"
          />

          <div class="chat-composer" role="presentation" (click)="focusMessageInput($event)">
            <textarea
              #messageTextarea
              class="chat-composer__textarea"
              rows="1"
              placeholder="Введите сообщение..."
              aria-label="Введите сообщение"
              autocomplete="off"
              [value]="messageInputValue()"
              (input)="onMessageInput($event)"
              (keydown)="onMessageKeydown($event)"
            ></textarea>

            <div class="chat-composer__actions">
              <button
                type="button"
                aria-label="Прикрепить файл"
                class="chat-composer__attach"
                (click)="openFilePicker()"
              >
                <svg size="18" lucidePaperclip aria-hidden="true"></svg>
                <span>Прикрепить</span>
              </button>

              <div class="chat-composer__submit">
                <button
                  type="button"
                  class="chat-composer__mic"
                  [class.chat-composer__mic--recording]="isRecording()"
                  [attr.aria-label]="speechLabel()"
                  [title]="isSpeechSupported ? speechLabel() : 'Голосовой ввод не поддерживается'"
                  [disabled]="isSending() || isStoppingSpeech() || agentStatus() !== null"
                  (click)="toggleSpeech()"
                >
                  <svg size="20" lucideMic aria-hidden="true"></svg>
                </button>

                <button
                  type="submit"
                  aria-label="Отправить"
                  class="button button--main button--squared chat-composer__send"
                  [disabled]="
                    !messageInputValue().trim() ||
                    isUploading() ||
                    isSending() ||
                    isStoppingSpeech() ||
                    agentStatus() !== null
                  "
                >
                  <svg size="20" lucideArrowUp aria-hidden="true"></svg>
                </button>
              </div>
            </div>
          </div>
        </form>
      }
    </footer>
  </div>
</section>

<app-drag-overlay (filesDropped)="onFilesDropped($event)" />
