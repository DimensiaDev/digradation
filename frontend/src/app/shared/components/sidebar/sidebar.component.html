<aside class="sidebar">
  <div class="sidebar__header">
    <div class="logo">
      <img src="/assets/imgs/logo.png" alt="logo" width="48" />
      <div class="h1">Digradation</div>
    </div>
    <button
      type="button"
      class="sidebar__toggle"
      [attr.aria-label]="collapsed() ? 'Развернуть меню' : 'Свернуть меню'"
      [attr.aria-expanded]="!collapsed()"
      (click)="toggleCollapsed()"
    >
      @if (collapsed()) {
        <svg size="20" lucidePanelLeftOpen aria-hidden="true"></svg>
      } @else {
        <svg size="20" lucidePanelLeftClose aria-hidden="true"></svg>
      }
    </button>
  </div>

  @if (role() === 'user') {
    <a class="button button--main cta h3" routerLink="/create">
      <svg class="cta__icon" lucidePlus></svg>
      <span>Новый чат</span>
    </a>
  }
  <nav class="navigation" aria-label="Основная навигация">
    <ul class="navigation__list">
      @for (nav of visibleNavItems(); track nav.route) {
        <li>
          <a
            class="navigation__item h3"
            [routerLink]="nav.route"
            routerLinkActive="active-link"
            ariaCurrentWhenActive="page"
            [attr.title]="collapsed() ? nav.label : null"
          >
            <svg class="navigation__icon" [lucideIcon]="nav.icon"></svg>
            <span>{{ nav.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="profile">
    @if (avatarLoading()) {
      <div class="photo skeleton-item skeleton-item--circle" aria-hidden="true"></div>
    } @else {
      <img [src]="avatarSrc()" alt="profile photo" class="photo" (error)="onAvatarError()" />
    }
    <div class="profile__content">
      <div class="profile__info">
        <span class="profile__name h3">{{ displayName() }}</span>
      </div>
      <button
        type="button"
        class="profile__logout"
        aria-label="Выйти"
        [disabled]="isLoggingOut()"
        (click)="logout()"
      >
        <svg size="18" lucideLogOut aria-hidden="true"></svg>
      </button>
    </div>
  </div>

  <div class="sidebar__footer">
    <button
      type="button"
      class="icon-action"
      [attr.aria-label]="theme() === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему'"
      [attr.title]="theme() === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему'"
      (click)="toggleTheme()"
    >
      @if (theme() === 'dark') {
        <svg size="18" lucideSun aria-hidden="true"></svg>
      } @else {
        <svg size="18" lucideMoon aria-hidden="true"></svg>
      }
    </button>
    @if (userMenuItem(); as item) {
      <a
        class="icon-action"
        [routerLink]="item.route"
        [attr.aria-label]="item.label"
        [title]="item.label"
      >
        <svg size="18" [lucideIcon]="item.icon" aria-hidden="true"></svg>
      </a>
    }
    @if (adminItem(); as admin) {
      <a
        class="icon-action"
        [routerLink]="admin.route"
        [attr.aria-label]="admin.label"
        [title]="admin.label"
      >
        <svg size="18" [lucideIcon]="admin.icon" aria-hidden="true"></svg>
      </a>
    }
  </div>
</aside>
