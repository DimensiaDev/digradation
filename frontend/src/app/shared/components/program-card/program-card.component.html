<article
  class="program-card"
  [attr.data-status]="program().status"
  [attr.data-theme]="program().theme"
>
  <button
    type="button"
    class="program-card__open"
    [attr.aria-label]="'Открыть программу «' + program().title + '»'"
    (click)="openProgram($event)"
  ></button>

  <svg class="program-card__watermark" [lucideIcon]="icon()" aria-hidden="true"></svg>

  <header class="program-card__top">
    <span class="program-card__status">
      <span class="program-card__status-dot" aria-hidden="true"></span>
      {{ statusLabel() }}
    </span>
  </header>

  <div class="program-card__body">
    <h2 class="program-card__title">{{ program().title }}</h2>

    @if (program().type || program().hours > 0) {
      <p class="program-card__meta">
        @if (program().type) {
          <span>{{ program().type }}</span>
        }
        @if (program().hours > 0) {
          <span>{{ program().hours }} ч</span>
        }
      </p>
    }
  </div>

  <footer class="program-card__footer">
    <time class="program-card__date" [attr.datetime]="program().updatedAt">
      <svg size="14" lucideCalendar aria-hidden="true"></svg>
      {{ formattedDate() }}
    </time>
  </footer>
</article>
