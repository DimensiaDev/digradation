[tool.poetry]
name = "edu-rag"
version = "0.1.0"
description = "Embedding + pgvector indexing for edu_parser output"
authors = ["AXRay"]
packages = [{ include = "edu_rag" }]

[tool.poetry.dependencies]
python = ">=3.14,<4"
pydantic = ">=2.13.5,<3.0.0"
httpx = ">=0.28.1,<0.29.0"
tenacity = ">=9.0.0,<10.0.0"
sqlalchemy = ">=2.0.52,<3.0.0"
asyncpg = ">=0.31.0,<0.32.0"
pgvector = ">=0.3.0,<0.4.0"
numpy = ">=2.0.0,<3.0.0"
greenlet = "^3.5.6"

[tool.poetry.group.dev.dependencies]
black = ">=26.5.1,<27.0.0"
ruff = ">=0.16.6,<0.17.0"
pytest = ">=9.1.1,<10.0.0"
pytest-asyncio = ">=1.4.0,<2.0.0"
pytest-cov = ">=7.1.0,<8.0.0"
testcontainers = { version = ">=4.15.0,<5.0.0", extras = ["postgres"] }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "ASYNC",
    "C4", "PIE", "T20", "Q", "RET", "SIM", "ARG", "PTH", "RUF",
]
ignore = [
    "PIE796", "B028", "RUF018", "N818", "B905",
    "RUF012", "B008", "RUF001", "RUF200",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001"]
"edu_rag/cli.py" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--cov=edu_rag --cov-report=term-missing"

[tool.coverage.run]
source = ["edu_rag"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.coverage.json]
output = "coverage.json"
